name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# 상태 파일(data/)을 커밋하므로 실행이 겹치지 않도록 직렬화
concurrency:
  group: rss-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 기본 checkout은 실행이 큐에 들어간 시점의 SHA를 쓴다. 직렬화(concurrency)로 대기하다 시작하면 앞선 실행의
      # 최종 커밋이 빠진 오래된 상태를 읽어 이미 보낸 알림을 다시 보내므로, 시작 시점의 브랜치 최신 커밋을 받는다.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 명령 처리 및 새 글 알림
        run: python -m rssbot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 새 글을 전송하기 전에 상태를 먼저 커밋(write-ahead)해, 실행이 중간에 끊겨도 알림이 유실되지 않게 한다.
          RSSBOT_CHECKPOINT_CMD: bash scripts/commit-state.sh
      - name: 상태 파일 커밋
        if: always()
        run: bash scripts/commit-state.sh
