name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# 상태 파일(data/)을 커밋하므로 실행이 겹치지 않도록 직렬화
concurrency:
  group: rss-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 명령 처리 및 새 글 알림
        run: python -m rssbot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 새 글을 전송하기 전에 상태를 먼저 커밋(write-ahead)해, 실행이 중간에 끊겨도 알림이 유실되지 않게 한다.
          RSSBOT_CHECKPOINT_CMD: bash scripts/commit-state.sh
      - name: 상태 파일 커밋
        if: always()
        run: bash scripts/commit-state.sh
